[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sih26155"
version = "0.1.0"
description = "AI-Driven Multi-Vendor Network Security Compliance Auditor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core data models / validation
    "pydantic>=2.8,<3",

    # API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",

    # Configuration / environment
    "python-dotenv>=1.0,<2",

    # HTTP / async utilities
    "httpx>=0.27,<1",

    # YAML policy files
    "PyYAML>=6.0,<7",

    # Network device connectivity
    "netmiko>=4.4,<5",
    "napalm>=5.0,<6",

    # AI / semantic retrieval
    "sentence-transformers>=3.0,<6",
    "numpy>=1.26,<3",

    # PDF / reporting
    "reportlab>=4.2,<5",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]


[tool.setuptools]
package-dir = {"" = "backend/src"}


[tool.setuptools.packages.find]
where = ["backend/src"]


[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true