system {
    services {
        ssh {
            protocol-version v2;
        }
    }

    login {
        retry-options {
            tries-before-disconnect 3;
            backoff-threshold 2;
            backoff-factor 5;
            minimum-time 20;
        }
    }

    syslog {
        user * {
            any emergency;
        }
    }
}