version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption

hostname CORE-EDGE-01

boot-start-marker
boot-end-marker

no aaa new-model

ip domain name corp.example.local
ip name-server 10.10.10.10
ip name-server 10.10.10.11

ip ssh version 1
ip http server

ip routing

interface GigabitEthernet0/0
 description WAN-UPLINK
 ip address 172.16.10.2 255.255.255.252
 no shutdown

interface GigabitEthernet0/1
 description SERVER-NETWORK
 ip address 10.10.20.1 255.255.255.0
 no shutdown

interface GigabitEthernet0/2
 description USER-NETWORK
 ip address 10.10.30.1 255.255.255.0
 no shutdown

interface GigabitEthernet0/3
 description MANAGEMENT-NETWORK
 ip address 10.10.40.1 255.255.255.0
 no shutdown

interface Loopback0
 description ROUTER-ID
 ip address 10.255.255.1 255.255.255.255

router ospf 10
 router-id 10.255.255.1
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.40.0 0.0.0.255 area 0

ip access-list extended MANAGEMENT-IN
 permit tcp 10.10.40.0 0.0.0.255 any eq 22
 permit tcp 10.10.40.0 0.0.0.255 any eq 80
 permit ip 10.10.40.0 0.0.0.255 any
 deny ip any any log

logging buffered 16384
logging trap warnings

snmp-server community PUBLIC ro
snmp-server location DATA-CENTER-01
snmp-server contact network-team@example.local

ntp server 10.10.40.20
ntp server 10.10.40.21

banner motd ^C
WARNING: Authorized access only.
All activity is monitored.
^C

line console 0
 logging synchronous
 exec-timeout 15 0

line vty 0 4
 transport input telnet
 exec-timeout 30 0
 login

line vty 5 15
 transport input telnet
 exec-timeout 30 0
 login

end
